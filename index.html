<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://unpkg.com/typewriter-effect@3/dist/core.js"></script>
    <title>Recipe Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI Recipe Generator</h1>
      </header>

      <div>
        <form id="recipe-generator-form">
          <input
            type="text"
            placeholder="Enter type of recipe"
            autofocus
            required
            autocomplete="off"
            class="prompt"
          />
          <input type="submit" class="submit-button" />
        </form>
      </div>
      <div class="recipe-output" id="recipe"></div>
      <br />
      <footer>
        This was coded by
        <a href="https://github.com/cmtaylor15" target="_blank"
          >Chelsea Taylor</a
        >
        and is
        <a href="https://github.com/cmtaylor15/recipegenerator" target="_blank"
          >open-sourced on GitHub</a
        >
        and hosted on
        <a href="https://easier-mealplans.netlify.app/" target="_blank"
          >Netlify</a
        >
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
